[project]
name = "interview-backend"
version = "0.1.0"
description = "AI Interview Platform — control plane (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "anthropic>=0.40",
    "httpx>=0.27",
    "livekit-api>=1.0",
    "minio>=7.2",
    "pypdf>=4.0",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.routes", "app.eval", "app.rounds", "providers"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.extend-per-file-ignores]
# B008: `Depends(...)` in defaults is the FastAPI dependency-injection idiom
"app/tenancy.py" = ["B008"]
# E501: hand-written DDL reads better unwrapped
"alembic/versions/*" = ["E501"]
# E501: long string literals in seed data / test fixtures / user-facing messages
"scripts/*" = ["E501"]
"tests/*" = ["E501"]
# E501: inline self-contained HTML/CSS templates + long user-facing messages
"app/eval/brief.py" = ["E501"]
"app/eval/aggregate.py" = ["E501"]
"app/routes/*" = ["B008", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: requires the docker-compose stack running"]
