# Judge0 configuration (dev). Secrets are dev-only defaults — override in prod.
# Full reference: https://github.com/judge0/judge0/blob/master/judge0.conf

REDIS_HOST=judge0-redis
REDIS_PORT=6379
REDIS_PASSWORD=judge0devredis

POSTGRES_HOST=judge0-db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0devpass

# Sandbox hard limits (backend clamps request values to these)
MAX_CPU_TIME_LIMIT=10
MAX_MEMORY_LIMIT=512000
# Network egress from candidate code is disabled
ALLOW_ENABLE_NETWORK=false
ENABLE_NETWORK=false

# Keep submissions retrievable long enough for debugging
SUBMISSION_CACHE_DURATION=1

ENABLE_WAIT_RESULT=true
MAINTENANCE_MODE=false
