[project]
name = "interview-agent"
version = "0.1.0"
description = "AI Interview Platform — LiveKit Agents voice worker (T1 spike)"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents[deepgram,cartesia,elevenlabs,anthropic,openai,turn-detector,silero]~=1.6",
    # livekit-plugins-anthropic 1.7 passes an httpx client; anthropic>=1.0 switched to httpx2
    "anthropic<1",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["spike_agent", "event_sink", "latency"]
packages = ["engine"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
