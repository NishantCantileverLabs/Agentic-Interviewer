[project]
name = "interview-eval-worker"
version = "0.1.0"
description = "AI Interview Platform — async evaluation worker"
requires-python = ">=3.11"
dependencies = [
    "redis>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["worker"]
