name: interview-platform

services:
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: interview
      POSTGRES_DB: interview
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview -d interview"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    restart: unless-stopped
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/recordings &&
      mc mb --ignore-existing local/briefs
      "

  api:
    restart: unless-stopped
    build: ./backend
    environment:
      # app runs as non-superuser (RLS binds); migrations as owner
      DATABASE_URL: postgresql+psycopg://app_user:app_user_dev_pass@postgres:5432/interview
      MIGRATIONS_DATABASE_URL: postgresql+psycopg://interview:interview@postgres:5432/interview
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: recordings
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      CONDUCT_MODEL: ${CONDUCT_MODEL:-claude-haiku-4-5}
      EVAL_MODEL: ${EVAL_MODEL:-claude-opus-5}
      JUDGE0_URL: http://judge0:2358
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-me}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      CORS_EXTRA_ORIGINS: ${CORS_EXTRA_ORIGINS:-}
      CANDIDATE_LINK_SECRET: ${CANDIDATE_LINK_SECRET:-dev-candidate-secret-change-me}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
      DEV_DEFAULT_ORG: ${DEV_DEFAULT_ORG:-false}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # Runs on the backend image so the eval pipeline shares providers/ and models
  # (see ARCHITECTURE.md — /worker dir retired in favor of app/eval).
  eval-worker:
    restart: unless-stopped
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://app_user:app_user_dev_pass@postgres:5432/interview
      REDIS_URL: redis://redis:6379/0
      EVAL_QUEUE: evaluate_session
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      EVAL_MODEL: ${EVAL_MODEL:-claude-opus-5}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: python -m app.eval.worker

  # Local LiveKit server (dev mode: key "devkey", secret "secret").
  # Swap for LiveKit Cloud creds in .env for representative latency numbers.
  livekit:
    restart: unless-stopped
    image: livekit/livekit-server:v1.13.5
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"       # websocket / API
      - "7881:7881"       # WebRTC over TCP fallback
      - "50000-50060:50000-50060/udp"
    environment:
      LIVEKIT_RTC_UDP_PORT_RANGE_START: "50000"
      LIVEKIT_RTC_UDP_PORT_RANGE_END: "50060"
      LIVEKIT_RTC_USE_EXTERNAL_IP: "false"

  # T3: Yjs CRDT sync server for the collaborative editor
  y-websocket:
    restart: unless-stopped
    image: node:20-alpine
    # v2+ dropped the bundled server binary; v1's server speaks the same sync protocol
    command: sh -c "npx -y y-websocket@1"
    environment:
      HOST: 0.0.0.0
      PORT: 1234
    ports:
      - "1234:1234"

  # T4: Judge0 stack — docker compose --profile sandbox up
  # v1.13.1+ required for cgroup-v2 (Docker Desktop / WSL2).
  judge0:
    restart: unless-stopped
    profiles: ["sandbox"]
    image: judge0/judge0:1.13.1
    volumes:
      - ./infra/judge0/judge0.conf:/judge0.conf:ro
    ports:
      - "2358:2358"
    privileged: true
    depends_on:
      - judge0-db
      - judge0-redis
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:2358/about || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  judge0-workers:
    restart: unless-stopped
    profiles: ["sandbox"]
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    volumes:
      - ./infra/judge0/judge0.conf:/judge0.conf:ro
    privileged: true
    depends_on:
      - judge0-db
      - judge0-redis

  judge0-db:
    restart: unless-stopped
    profiles: ["sandbox"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0devpass
      POSTGRES_DB: judge0
    volumes:
      - judge0-pgdata:/var/lib/postgresql/data

  judge0-redis:
    restart: unless-stopped
    profiles: ["sandbox"]
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "judge0devredis"]

  # Frontend dev server (containerized option; local `npm run dev` is fine too)
  # Voice agent worker, containerized (production path). Local development
  # runs `agent/.venv/Scripts/python interview_agent.py dev` on the host for
  # hot iteration; this service is the deployable form.
  agent:
    profiles: ["agent"]
    restart: unless-stopped
    build: ./agent
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      BACKEND_URL: http://api:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      CARTESIA_API_KEY: ${CARTESIA_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      CONDUCT_MODEL: ${CONDUCT_MODEL:-claude-haiku-4-5}
      TTS_PRIMARY: ${TTS_PRIMARY:-deepgram}
      TURN_DETECTOR: ${TURN_DETECTOR:-stt}
    depends_on:
      livekit:
        condition: service_started
      api:
        condition: service_healthy

  # Production frontend (next build + next start). For local development use
  # `npm run dev` directly instead — hot reload beats a container rebuild.
  frontend:
    profiles: ["frontend"]
    restart: unless-stopped
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_YWS_URL: ${NEXT_PUBLIC_YWS_URL:-ws://localhost:1234}
    ports:
      - "3000:3000"

volumes:
  pgdata:
  minio-data:
  judge0-pgdata:
